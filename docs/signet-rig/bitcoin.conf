# A private signet whose blocks anyone can make. The challenge is OP_TRUE (51),
# so `generatetoaddress` mines without a signing key, and nothing on this chain
# is worth anything. start.sh copies this file into the rig's data directory.
signet=1

[signet]
signetchallenge=51
server=1
txindex=1
fallbackfee=0.0001
# Local only: the RPC is for mine.sh and electrs on this machine, and no peer
# is ever wanted.
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=38332
rpcuser=rig
rpcpassword=rig
listen=0
dnsseed=0
