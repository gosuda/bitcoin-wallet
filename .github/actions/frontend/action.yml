name: frontend
description: >-
  Sets up pnpm and the Node that .nvmrc names, with pnpm's store cached against
  pnpm-lock.yaml, builds the wasm core the apps import (the wasm-core action),
  then installs the workspace. Expects a Rust toolchain with the
  wasm32-unknown-unknown target already installed by the calling job.

runs:
  using: composite
  steps:
    # The version comes from `packageManager` in the root package.json.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - uses: ./.github/actions/wasm-core
    - shell: bash
      run: pnpm install --frozen-lockfile
