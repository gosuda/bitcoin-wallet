name: frontend
description: >-
  Sets up pnpm and Node 22, with pnpm's store cached against pnpm-lock.yaml,
  then builds the wasm core the apps import (the wasm-core action). Expects a
  Rust toolchain with the wasm32-unknown-unknown target already installed by
  the calling job; `pnpm install` is left to the job.

runs:
  using: composite
  steps:
    # The version comes from `packageManager` in the root package.json.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - uses: ./.github/actions/wasm-core
