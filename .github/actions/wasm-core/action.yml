name: wasm core
description: >-
  Builds crates/wallet-wasm into packages/wallet-ui/src/wasm/pkg, where both apps
  import it from. Expects a Rust toolchain with the wasm32-unknown-unknown target
  already installed by the calling job.

runs:
  using: composite
  steps:
    # A prebuilt binary. `cargo install wasm-pack` compiled it from source in
    # every leg that needed it — minutes each time, for a tool that is the same
    # on every run.
    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack
    # secp256k1's C sources are compiled for wasm32 too, and Apple's clang has
    # no wasm32 backend ("No available targets are compatible with triple"),
    # so on macOS the build is pointed at Homebrew's LLVM, installed if the
    # image carries none. Linux's clang already has the backend.
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        llvm=$(ls -d "$(brew --prefix)"/opt/llvm*/ 2>/dev/null | sort -V | tail -1)
        if [ ! -x "${llvm}bin/clang" ]; then
          brew install llvm
          llvm="$(brew --prefix llvm)/"
        fi
        echo "wasm32 C compiler: ${llvm}bin/clang ($("${llvm}bin/clang" --version | head -1))"
        echo "CC_wasm32_unknown_unknown=${llvm}bin/clang" >> "$GITHUB_ENV"
        echo "AR_wasm32_unknown_unknown=${llvm}bin/llvm-ar" >> "$GITHUB_ENV"
    - shell: bash
      run: wasm-pack build crates/wallet-wasm --target web --release --out-dir ../../packages/wallet-ui/src/wasm/pkg
