name: wasm core
description: >-
  Builds crates/wallet-wasm into packages/wallet-ui/src/wasm/pkg, where both apps
  import it from. Expects a Rust toolchain with the wasm32-unknown-unknown target
  already installed by the calling job.

runs:
  using: composite
  steps:
    # A prebuilt binary: building wasm-pack from source takes minutes.
    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack
    # On macOS, scripts/with-wasm-cc.sh builds with Homebrew's LLVM.
    - if: runner.os == 'macOS'
      shell: bash
      run: compgen -G "$(brew --prefix)/opt/llvm*/bin/clang" >/dev/null || brew install llvm
    - shell: bash
      run: bash scripts/build-wasm.sh
