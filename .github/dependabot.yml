# Weekly upgrade pull requests for the repository's ecosystems. Minor and
# patch bumps are grouped into one pull request per ecosystem, so a week's
# routine upgrades are reviewed and reverted as a unit; a major bump arrives on
# its own, since that is where things break. Titles follow the repository's
# Conventional Commits: `build(deps): ...`, and `ci(deps): ...` for actions.
#
# Security updates are a repository setting, not this file.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # One pnpm workspace and one lockfile at the root cover all three packages.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # `/` covers .github/workflows; a composite action has to be named on its own.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/frontend
      - /.github/actions/wasm-core
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # No gradle entry: the Android project under apps/native/src-tauri/gen/android
  # is Tauri's generated project, and its toolchain is pinned by Tauri's own
  # Android plugin modules, which build with the same Kotlin. Every upgrade
  # Dependabot proposed failed a local APK build (2026-09-29): Kotlin 2.4 turns
  # the plugins' `kotlinOptions` into an error, Gradle 9 breaks the generated
  # buildSrc, and the newer androidx libraries are compiled with Kotlin 2.1,
  # which Kotlin 1.9 cannot read. Move these with Tauri's template instead.
  # Security updates still cover them; that setting is not this file.
