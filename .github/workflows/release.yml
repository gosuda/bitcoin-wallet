name: release

# Tag a version to publish installers, or run it by hand to check that the
# bundles still build. A manual run uploads artifacts and creates nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag names the version it releases. One that disagrees with the workspace
  # would publish installers numbered differently from their tag, so nothing
  # is built until the two match. A manual run just checks the copies agree.
  version:
    name: version matches the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check the version, and the tag when there is one
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: scripts/check-version.sh ${TAG:+"$TAG"}

  bundle:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    # Never run yet, so there is no measured duration to set this from; a
    # release build (thin LTO, one codegen unit, notarisation) is the slowest
    # thing this repository does, and an hour is several times anything the
    # other workflow has taken.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (apple silicon)
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            name: macOS (intel)
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - os: ubuntu-24.04
            name: Linux
            args: ""
            rust-target: ""
          - os: windows-latest
            name: Windows
            args: ""
            rust-target: ""
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ matrix.rust-target && format(',{0}', matrix.rust-target) || '' }}
      - uses: Swatinem/rust-cache@v2
      # The version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # The frontend imports the wasm core, so it has to exist before the build.
      - uses: ./.github/actions/wasm-core

      # One workspace, one lockfile: install from the repo root.
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing and notarisation only happen when these secrets exist; the
          # build still succeeds unsigned without them (see docs/RELEASING.md).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/native
          # Only a tag publishes; a manual run just proves the bundles build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseDraft: true
          prerelease: false
          # No updater: v1 renamed this from includeUpdaterJson and defaults it
          # to true, so the old name would be ignored and latest.json uploaded.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Keep the bundles for a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.rust-target || 'native' }}
          path: |
            target/release/bundle/**
            target/*/release/bundle/**
          if-no-files-found: warn
          retention-days: 7

  # Which store signing keys the repository holds. A phone leg below runs only
  # when its key exists — without one there is nothing it could publish — and a
  # job's `if` cannot read secrets directly, hence this job.
  keys:
    name: which signing keys exist
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.check.outputs.android }}
    steps:
      - id: check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "android=${ANDROID_KEYSTORE_BASE64:+true}" >> "$GITHUB_OUTPUT"

  android:
    name: Android (signed)
    needs: [version, keys, bundle]
    if: needs.keys.outputs.android == 'true'
    runs-on: ubuntu-24.04
    # All four ABIs, each a full release build of the Rust library.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/wasm-core
      - run: pnpm install --frozen-lockfile

      # The keystore exists only in this job's temporary directory; the Gradle
      # build reads it through ANDROID_KEYSTORE_* (app/build.gradle.kts).
      - name: Build the signed APK and app bundle
        working-directory: apps/native
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          pnpm tauri android build --apk --aab --ci

      - name: Check the APK carries the upload key's signature
        run: |
          apksigner=""
          for tools in "$ANDROID_HOME"/build-tools/*/; do apksigner="${tools}apksigner"; done
          for apk in apps/native/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk; do
            "$apksigner" verify --print-certs "$apk"
          done

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" --clobber \
            apps/native/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk \
            apps/native/src-tauri/gen/android/app/build/outputs/bundle/*/*.aab

      - name: Keep them for a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            apps/native/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
            apps/native/src-tauri/gen/android/app/build/outputs/bundle/*/*.aab
          if-no-files-found: error
          retention-days: 7
