name: release

# Tag a version to publish installers, or run it by hand to check that the
# bundles still build. A manual run uploads artifacts and creates nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A rerun of one tag must not race with another run replacing its draft assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag names the version it releases. One that disagrees with the workspace
  # would publish installers numbered differently from their tag, so nothing
  # is built until the two match. A manual run just checks the copies agree.
  version:
    name: version matches the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the version, and the tag when there is one
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: scripts/check-version.sh ${TAG:+"$TAG"}

      - name: Release action references are immutable
        run: bash scripts/check-release-action-pins.sh

  bundle:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    # Never run yet, so there is no measured duration to set this from; a
    # release build (thin LTO, one codegen unit, notarisation) is the slowest
    # thing this repository does, and an hour is several times anything the
    # other workflow has taken.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (apple silicon)
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            name: macOS (intel)
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - os: ubuntu-24.04
            name: Linux
            args: ""
            rust-target: ""
          - os: windows-latest
            name: Windows
            args: ""
            rust-target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown${{ matrix.rust-target && format(',{0}', matrix.rust-target) || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # The frontend imports the wasm core, so it has to exist before the build.
      - uses: ./.github/actions/frontend

      # One workspace, one lockfile: install from the repo root.
      - run: pnpm install --frozen-lockfile

      # Only the signing command sees Apple secrets. Empty secrets must not
      # become APPLE_* environment variables: Tauri treats their presence as
      # a request to sign, even if their value is empty.
      - name: Build and sign macOS installers
        if: runner.os == 'macOS'
        working-directory: apps/native
        shell: bash
        env:
          SIGN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SIGN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGN_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SIGN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            source="SIGN_$name"
            value="${!source}"
            unset "$source"
            if [[ -n "$value" ]]; then
              export "$name=$value"
            fi
          done
          unset source value
          pnpm tauri build --ci ${{ matrix.args }}

      - name: Build Linux and Windows installers
        if: runner.os != 'macOS'
        working-directory: apps/native
        run: pnpm tauri build --ci ${{ matrix.args }}

      # Build jobs cannot modify releases. Artifacts are published only by the
      # final job, after all requested platform builds have succeeded.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-bundle-${{ matrix.os }}-${{ matrix.rust-target || 'native' }}
          path: |
            target/release/bundle/**
            target/*/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  # Which store signing keys the repository holds. A phone leg below runs only
  # when its key exists — without one there is nothing it could publish — and a
  # job's `if` cannot read secrets directly, hence this job.
  keys:
    name: which signing keys exist
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - id: check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "android=${ANDROID_KEYSTORE_BASE64:+true}" >> "$GITHUB_OUTPUT"
          echo "ios=${APPLE_API_KEY_P8:+true}" >> "$GITHUB_OUTPUT"

  android:
    name: Android (signed)
    needs: [version, keys, bundle]
    if: needs.keys.outputs.android == 'true'
    runs-on: ubuntu-24.04
    # All four ABIs, each a full release build of the Rust library.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/frontend
      - run: pnpm install --frozen-lockfile

      # The keystore exists only in this job's temporary directory; the Gradle
      # build reads it through ANDROID_KEYSTORE_* (app/build.gradle.kts).
      - name: Build the signed APK and app bundle
        working-directory: apps/native
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          pnpm tauri android build --apk --aab --ci

      - name: Check the APK carries the upload key's signature
        run: |
          apksigner=""
          for tools in "$ANDROID_HOME"/build-tools/*/; do apksigner="${tools}apksigner"; done
          for apk in apps/native/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk; do
            "$apksigner" verify --print-certs "$apk"
          done

      # Keep signed packages as workflow artifacts until publication. No
      # repository write token is available in this signing job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-android
          path: |
            apps/native/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
            apps/native/src-tauri/gen/android/app/build/outputs/bundle/*/*.aab
          if-no-files-found: error
          retention-days: 7

  # An .ipa for the devices registered to the team (ad hoc), signed through an
  # App Store Connect API key: Xcode fetches or creates the distribution
  # certificate and the profile itself, so nothing is imported into a keychain.
  ios:
    name: iOS (signed, registered devices)
    needs: [version, keys, bundle]
    if: needs.keys.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: ./.github/actions/frontend
      - run: pnpm install --frozen-lockfile

      # The CLI reads the team from APPLE_DEVELOPMENT_TEAM and the key from a
      # file, so the key exists only in this job's temporary directory.
      - name: Build and sign the app
        working-directory: apps/native
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          pnpm tauri ios build --export-method release-testing --ci

      - name: Check the app's signature
        run: |
          for ipa in apps/native/src-tauri/gen/apple/build/*/*.ipa; do
            unpacked=$(mktemp -d)
            ditto -x -k "$ipa" "$unpacked"
            codesign --verify --deep --strict --verbose=2 "$unpacked"/Payload/*.app
            codesign --display --verbose=2 "$unpacked"/Payload/*.app
          done

      # Keep signed packages as workflow artifacts until publication.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-ios
          path: apps/native/src-tauri/gen/apple/build/*/*.ipa
          if-no-files-found: error
          retention-days: 7

  # All build and signing jobs run with a read-only token. The only job with
  # release-write authority downloads artifacts that have already been built.
  publish:
    name: Draft release
    needs: [version, keys, bundle, android, ios]
    if: >-
      ${{
        always() &&
        startsWith(github.ref, 'refs/tags/v') &&
        needs.version.result == 'success' &&
        needs.keys.result == 'success' &&
        needs.bundle.result == 'success' &&
        (needs.android.result == 'success' || needs.android.result == 'skipped') &&
        (needs.ios.result == 'success' || needs.ios.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release-artifacts

      - name: Attach installers to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(
            find release-artifacts -type f \
              \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
                 -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \
                 -o -name '*.apk' -o -name '*.aab' -o -name '*.ipa' \) \
              -print0 | sort -z
          )
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release installers were built"
            exit 1
          fi

          declare -A names=()
          manifest="$RUNNER_TEMP/SHA256SUMS"
          : > "$manifest"
          for file in "${files[@]}"; do
            name="${file##*/}"
            if [[ -n "${names[$name]:-}" ]]; then
              echo "::error::Duplicate installer filename: $name"
              exit 1
            fi
            names["$name"]=1
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$digest" "$name" >> "$manifest"
          done

          if gh release view "$TAG" --json isDraft --jq '.isDraft' >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" != true ]]; then
              echo "::error::Refusing to replace files on a published release"
              exit 1
            fi
          else
            gh release create "$TAG" --draft --title "$TAG" --notes ""
          fi
          # A rerun must not leave old installers attached to the draft,
          # especially if a platform's signing key has since been removed.
          # Preserve unrelated assets that maintainers attached manually.
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          while IFS= read -r asset; do
            case "$asset" in
              *.dmg|*.msi|*.exe|*.deb|*.AppImage|*.rpm|*.apk|*.aab|*.ipa|SHA256SUMS)
                gh release delete-asset "$TAG" "$asset" --yes
                ;;
            esac
          done <<< "$assets"
          gh release upload "$TAG" "${files[@]}" "$manifest"
