name: rust

on:
  push:
    branches: [main]
    paths: ["Cargo.*", "crates/**", "apps/desktop/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["Cargo.*", "crates/**", "apps/desktop/**", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: wallet-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p wallet-core -p wallet-cli --all-targets -- -D warnings
      - run: cargo test -p wallet-core -p wallet-cli
      - run: cargo build -p wallet-cli --release

  regtest:
    name: end-to-end on regtest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # bdk_testenv downloads bitcoind and electrs (with the Esplora HTTP API)
      # on first build, so no services or Docker are needed here.
      - run: cargo test -p regtest-tests -- --test-threads=1

  wasm:
    name: wallet-core + wallet-wasm (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p wallet-core --target wasm32-unknown-unknown --no-default-features --features backend-esplora -- -D warnings
      - run: cargo clippy -p wallet-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build crates/wallet-wasm --target web --release --out-dir ../../apps/desktop/src/wasm/pkg

  desktop:
    name: desktop app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # package.json lives under apps/desktop, so the action cannot infer a
      # version from the repo root: pin it here.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      # Tauri's Linux build needs the webkit stack.
      - name: Install Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # The frontend imports the wasm package, so build it before typechecking.
      - name: Build the wasm core
        working-directory: .
        run: |
          cargo install wasm-pack --locked
          wasm-pack build crates/wallet-wasm --target web --release --out-dir ../../apps/desktop/src/wasm/pkg
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm tsc --noEmit
      - run: pnpm vite build
      - name: Build the Tauri shell
        working-directory: .
        run: cargo clippy -p bitcoin-wallet-desktop --all-targets -- -D warnings
