name: rust

on:
  push:
    branches: [main]
    paths: ["Cargo.*", "crates/**", "apps/desktop/src-tauri/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["Cargo.*", "crates/**", "apps/desktop/src-tauri/**", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: wallet-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p wallet-core -p wallet-cli --all-targets -- -D warnings
      - run: cargo test -p wallet-core -p wallet-cli
      - run: cargo build -p wallet-cli --release
