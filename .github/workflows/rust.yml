name: rust

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; each merge group keeps its own verdict.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Each job's `name` is a required check in docs/rulesets/main.json. Rename or
# drop one only together with that list, or every pull request waits forever.
jobs:
  core:
    name: wallet-core (${{ matrix.os }})
    # Preserve the required check names while routing all compute to Depot.
    runs-on: ${{ matrix.os == 'macos-latest' && 'depot-macos-latest' || matrix.os == 'windows-latest' && 'depot-windows-2025' || 'depot-ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy -p wallet-core -p wallet-cli --all-targets -- -D warnings
      # Nothing builds the core with no features at all, so a gate that only
      # compiles because a default feature happens to pull in its import would
      # go unnoticed. Feature-less code has no per-OS paths; one runner is enough.
      - name: wallet-core with no features
        if: runner.os == 'Linux'
        run: cargo clippy -p wallet-core --no-default-features -- -D warnings
      # Neither check is per-OS, so one runner is enough.
      - name: Every copy of the version agrees
        if: runner.os == 'Linux'
        run: scripts/check-version.sh
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        if: runner.os == 'Linux'
        with:
          tool: just
      - name: The justfile parses
        if: runner.os == 'Linux'
        run: just --list
      # The full test suite and the release link run once on Linux; every
      # runner still formats and lints natively, so each required check
      # keeps a native verdict without paying for the same build three
      # times.
      - run: cargo test -p wallet-core -p wallet-cli
        if: runner.os == 'Linux'
      - run: cargo build -p wallet-cli --release
        if: runner.os == 'Linux'

  regtest:
    name: end-to-end on regtest
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy -p regtest-tests --all-targets -- -D warnings
      # bdk_testenv downloads bitcoind and electrs (with the Esplora HTTP API)
      # on first build, so no services or Docker are needed here.
      - run: cargo test -p regtest-tests -- --test-threads=1

  deny:
    name: cargo deny
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Advisories, licences, bans and sources, with every exception and its
      # reason in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2

  wasm:
    name: wallet-core + wallet-wasm (wasm32)
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy -p wallet-core --target wasm32-unknown-unknown --no-default-features --features backend-esplora --all-targets -- -D warnings
      - run: cargo clippy -p wallet-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - uses: ./.github/actions/wasm-core
      # Compiling proves nothing about what JS receives: these run the bindings
      # and the wasm-only deadline race in Node, with the wasm-core action's
      # wasm-pack, on the apps job's Node rather than the image's default.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: wasm-pack test --node crates/wallet-wasm
      - run: wasm-pack test --node crates/wallet-core --no-default-features --features backend-esplora

  # Compile-only: it catches a crate that does not build for a phone target,
  # not a keystore that builds and then fails on the device (the app's startup
  # self-check is for that).
  mobile:
    name: app shell (${{ matrix.name }})
    # Same queue fix as the core job above; app shell names name the phone
    # target, so they are unaffected by the runner move.
    runs-on: ${{ matrix.os == 'macos-latest' && 'depot-macos-latest' || matrix.os == 'windows-latest' && 'depot-windows-2025' || 'depot-ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: iOS
            target: aarch64-apple-ios
          - os: macos-latest
            name: iOS Simulator
            target: aarch64-apple-ios-sim
          - os: ubuntu-24.04
            name: Android
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The NDK names its compiler wrappers with the API level, so cc-rs cannot
      # find `aarch64-linux-android-clang` on its own. `tauri android build`
      # sets this up internally; a bare cargo invocation has to be told.
      - name: Point cc-rs at the NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        run: |
          TC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$TC/aarch64-linux-android26-clang"
            echo "AR_aarch64_linux_android=$TC/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TC/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"

      - run: cargo clippy -p bitcoin-wallet-app --target ${{ matrix.target }} -- -D warnings

  apps:
    name: desktop + web apps
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Tauri's Linux build needs the webkit stack.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: ./.github/actions/frontend
      - run: scripts/check-tauri-pairs.sh

      # The same commands a contributor runs from the root: every package that
      # has the script gets it, so a new package is covered without an edit here.
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # A moderate advisory is Dependabot's to propose, not a reason to fail.
      - run: pnpm audit --audit-level=high

      - name: Build the Tauri shell
        run: cargo clippy -p bitcoin-wallet-app --all-targets -- -D warnings
