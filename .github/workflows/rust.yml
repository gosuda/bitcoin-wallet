name: rust

on:
  push:
    branches: [main]
    paths:
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "deny.toml"
      - ".cargo/**"
      - "crates/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "biome.json"
      - "tsconfig.base.json"
      - "pnpm-*"
      - "clippy.toml"
      - "scripts/**"
      - "justfile"
      - ".github/**"
  # No path filter: main's ruleset (docs/rulesets/main.json) requires these
  # jobs by name, and a required check that never reports holds a pull request
  # open for good — a docs-only change could never be merged.
  pull_request:

# Every job here only reads the repository and runs builds and tests, so the
# token needs nothing else. Without this each job inherits the repository
# default, which can include write scopes.
permissions:
  contents: read

# A newer push to a pull request makes the older run's answer moot. Without
# this, superseded runs still waited their turn for a runner: the multi-hour
# runs of this workflow were all queue time — no job has executed for more
# than about five minutes. Pushes to main are never cancelled, so every merge
# keeps its own verdict.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Each job's `name` is a required check in docs/rulesets/main.json. Rename or
# drop one only together with that list, or every pull request waits forever.
jobs:
  core:
    name: wallet-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p wallet-core -p wallet-cli --all-targets -- -D warnings
      # Nothing builds the core with no features at all, so a gate that only
      # compiles because a default feature happens to pull in its import would
      # go unnoticed. Feature-less code has no per-OS paths; one runner is enough.
      - name: wallet-core with no features
        if: runner.os == 'Linux'
        run: cargo clippy -p wallet-core --no-default-features -- -D warnings
      # The version is written once, in Cargo.toml; every other copy has to
      # agree, and the justfile that bumps them has to parse. Neither has
      # anything per-OS about it.
      - name: Every copy of the version agrees
        if: runner.os == 'Linux'
        run: scripts/check-version.sh
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: just
      - name: The justfile parses
        if: runner.os == 'Linux'
        run: just --list
      - run: cargo test -p wallet-core -p wallet-cli
      - run: cargo build -p wallet-cli --release

  regtest:
    name: end-to-end on regtest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p regtest-tests --all-targets -- -D warnings
      # bdk_testenv downloads bitcoind and electrs (with the Esplora HTTP API)
      # on first build, so no services or Docker are needed here.
      - run: cargo test -p regtest-tests -- --test-threads=1

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Advisories, licences, bans and sources, with every exception and its
      # reason in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2

  wasm:
    name: wallet-core + wallet-wasm (wasm32)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p wallet-core --target wasm32-unknown-unknown --no-default-features --features backend-esplora --all-targets -- -D warnings
      - run: cargo clippy -p wallet-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - uses: ./.github/actions/wasm-core
      # Compiling it proves nothing about what JS receives. These run the
      # bindings and the wasm-only deadline race in Node, with the wasm-pack
      # the step above installed. Pinned like the apps job, so the image's
      # default Node changing cannot change a result.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: wasm-pack test --node crates/wallet-wasm
      - run: wasm-pack test --node crates/wallet-core --no-default-features --features backend-esplora

  # Compile-only. It cannot catch a keystore that builds and then fails on the
  # device — that is what the startup self-check in the app is for — but it does
  # catch the whole class of "this crate does not exist on iOS" breakage, which
  # is how the apple-native-keyring-store `protected` requirement surfaced.
  mobile:
    name: app shell (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: iOS
            target: aarch64-apple-ios
          - os: macos-latest
            name: iOS Simulator
            target: aarch64-apple-ios-sim
          - os: ubuntu-24.04
            name: Android
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # The NDK names its compiler wrappers with the API level, so cc-rs cannot
      # find `aarch64-linux-android-clang` on its own. `tauri android build`
      # sets this up internally; a bare cargo invocation has to be told.
      - name: Point cc-rs at the NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        run: |
          TC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$TC/aarch64-linux-android26-clang"
            echo "AR_aarch64_linux_android=$TC/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TC/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"

      - run: cargo clippy -p bitcoin-wallet-app --target ${{ matrix.target }} -- -D warnings

  apps:
    name: desktop + web apps
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Tauri's Linux build needs the webkit stack.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Both apps import the wasm core through @bitcoin-wallet/ui, so build it
      # before anything typechecks.
      - uses: ./.github/actions/frontend
      - run: pnpm install --frozen-lockfile
      # The Tauri CLI will not build when a crate and its npm half differ in
      # major.minor, and nothing here runs the CLI; Dependabot bumps the two
      # sides separately, so this is the CLI's own check, made on every change.
      - run: scripts/check-tauri-pairs.sh

      # The same commands a contributor runs from the root: every package that
      # has the script gets it, so a new package is covered without an edit here.
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Fails on high and critical advisories only; a moderate one in a dev tool
      # is Dependabot's to propose, not a reason to stop every build.
      - run: pnpm audit --audit-level=high

      - name: Build the Tauri shell
        run: cargo clippy -p bitcoin-wallet-app --all-targets -- -D warnings
