name: rust

on:
  push:
    branches: [main]
    paths:
      ["Cargo.*", "crates/**", "apps/**", "packages/**", "pnpm-*", ".github/workflows/rust.yml"]
  pull_request:
    paths:
      ["Cargo.*", "crates/**", "apps/**", "packages/**", "pnpm-*", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: wallet-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p wallet-core -p wallet-cli --all-targets -- -D warnings
      - run: cargo test -p wallet-core -p wallet-cli
      - run: cargo build -p wallet-cli --release

  regtest:
    name: end-to-end on regtest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # bdk_testenv downloads bitcoind and electrs (with the Esplora HTTP API)
      # on first build, so no services or Docker are needed here.
      - run: cargo test -p regtest-tests -- --test-threads=1

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      # Advisories we cannot act on are listed with reasons in .cargo/audit.toml.
      - run: cargo audit

  wasm:
    name: wallet-core + wallet-wasm (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p wallet-core --target wasm32-unknown-unknown --no-default-features --features backend-esplora -- -D warnings
      - run: cargo clippy -p wallet-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build crates/wallet-wasm --target web --release --out-dir ../../packages/wallet-ui/src/wasm/pkg

  # Compile-only. It cannot catch a keystore that builds and then fails on the
  # device — that is what the startup self-check in the app is for — but it does
  # catch the whole class of "this crate does not exist on iOS" breakage, which
  # is how the apple-native-keyring-store `protected` requirement surfaced.
  mobile:
    name: app shell (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: iOS
            target: aarch64-apple-ios
          - os: macos-latest
            name: iOS Simulator
            target: aarch64-apple-ios-sim
          - os: ubuntu-24.04
            name: Android
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # The NDK names its compiler wrappers with the API level, so cc-rs cannot
      # find `aarch64-linux-android-clang` on its own. `tauri android build`
      # sets this up internally; a bare cargo invocation has to be told.
      - name: Point cc-rs at the NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        run: |
          TC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TC/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TC/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TC/aarch64-linux-android26-clang" >> "$GITHUB_ENV"

      - run: cargo clippy -p bitcoin-wallet-app --target ${{ matrix.target }} -- -D warnings

  apps:
    name: desktop + web apps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Tauri's Linux build needs the webkit stack.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Both apps import the wasm core through @bitcoin-wallet/ui, so build it
      # before anything typechecks.
      - name: Build the wasm core
        run: |
          cargo install wasm-pack --locked
          wasm-pack build crates/wallet-wasm --target web --release --out-dir ../../packages/wallet-ui/src/wasm/pkg
      - run: pnpm install --frozen-lockfile

      - name: Check the shared UI package
        working-directory: packages/wallet-ui
        run: pnpm biome ci .

      - name: Native app
        working-directory: apps/native
        run: |
          pnpm biome ci .
          pnpm tsc --noEmit
          pnpm vite build

      - name: Web app
        working-directory: apps/web
        run: |
          pnpm biome ci .
          pnpm tsc --noEmit
          pnpm vite build

      - name: Build the Tauri shell
        run: cargo clippy -p bitcoin-wallet-app --all-targets -- -D warnings
