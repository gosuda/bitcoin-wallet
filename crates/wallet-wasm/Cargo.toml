[package]
name = "wallet-wasm"
version.workspace = true
description = "wasm-bindgen bindings for wallet-core (browser and Tauri webview)"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wallet-core = { path = "../wallet-core", default-features = false, features = ["backend-esplora"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# Only wasm32 has anything to test: the crate is empty elsewhere. Run with
# `wasm-pack test --node crates/wallet-wasm`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# The Rust toolchain emits bulk-memory ops; wasm-opt must be told to accept them.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lints]
workspace = true
