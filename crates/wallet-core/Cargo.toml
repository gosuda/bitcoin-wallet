[package]
name = "wallet-core"
version = "0.1.0"
description = "Portable Bitcoin wallet core built on BDK; runs natively and in WASM"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["backend-esplora", "keystore-native"]
backend-esplora = ["dep:bdk_esplora"]
# OS credential store (macOS Keychain, Windows Credential Manager, Secret Service). Native only.
keystore-native = ["dep:keyring"]

[dependencies]
bdk_wallet = { workspace = true }
async-trait = { workspace = true }
async-lock = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bdk_esplora = { version = "0.22.2", default-features = false, features = ["async-https-rustls", "tokio"], optional = true }
keyring = { version = "4", default-features = false, features = ["v1"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser supplies TLS; reqwest uses `fetch` here.
bdk_esplora = { version = "0.22.2", default-features = false, features = ["async"], optional = true }
getrandom = { version = "0.2", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
send_wrapper = { version = "0.6", features = ["futures"] }

[dev-dependencies]
tokio = { workspace = true }
