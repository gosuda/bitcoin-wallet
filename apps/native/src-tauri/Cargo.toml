[package]
name = "bitcoin-wallet-app"
version = "0.1.0"
description = "Bitcoin wallet app shell: desktop, iOS and Android"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "bitcoin_wallet_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Native shell only: no chain backend is compiled in, the webview owns the wallet.
wallet-core = { path = "../../../crates/wallet-core", default-features = false, features = ["keystore-native"] }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
tauri = { version = "2.11", features = [] }
tauri-plugin-store = "2.4"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-opener = "2.5"

# Mobile-only: the desktop build has no camera, no biometrics and registers no
# URI scheme, and these plugins do not build for it.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4"
tauri-plugin-biometric = "2.3"
tauri-plugin-deep-link = "2.4"
