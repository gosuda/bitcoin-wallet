[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/gosuda/bitcoin-wallet"
rust-version = "1.85"

[workspace.dependencies]
wallet-core = { path = "crates/wallet-core" }

bdk_wallet = { version = "3.1.0", features = ["std", "rusqlite"] }
bdk_esplora = { version = "0.22.2", default-features = false, features = ["async-https-rustls", "tokio"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
