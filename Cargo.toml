[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/gosuda/bitcoin-wallet"
rust-version = "1.85"

[workspace.dependencies]
wallet-core = { path = "crates/wallet-core" }

bdk_wallet = { version = "3.1.0", default-features = false, features = ["std"] }

tokio = { version = "1", features = ["rt", "macros"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
async-lock = "3"
web-time = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
