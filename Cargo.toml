[workspace]
resolver = "3"
members = ["crates/*", "apps/native/src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/gosuda/bitcoin-wallet"
rust-version = "1.88"

[workspace.dependencies]
wallet-core = { path = "crates/wallet-core" }

bdk_wallet = { version = "3.1.0", default-features = false, features = ["std", "keys-bip39"] }

tokio = { version = "1", features = ["rt", "macros"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
async-lock = "3"
web-time = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

# Production code has no unwrap/expect/todo/dbg today; these keep it that way.
# Tests are exempt through clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Fee rates are multiplied by transaction weights; a wrap in a release build
# would be a wrong amount, where a panic is only a refused send.
overflow-checks = true
